name: test

on:
  push:
    branches:
      - main
      # A factory `ci` suite pushes the candidate it is judging here and reads
      # this workflow's run for that commit as the gate verdict
      # (dec-spor-command-gate-ci-mode); the branch is deleted afterwards.
      - "spor/candidate/**"
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: Node ${{ matrix.node }} on ${{ matrix.os }} (shard ${{ matrix.shard }}/4)
    runs-on: ${{ matrix.os }}
    # A wedged shard fails at this ceiling with the runner's own verdict
    # instead of sitting out GitHub's 6h default with no output
    # (task-spor-acceptance-suites-on-isolated-ci-runners).
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
        node:
          - 24
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run test:shard -- ${{ matrix.shard }}/4

  conformance:
    name: Conformance (Node ${{ matrix.node }} on ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
        node:
          - 24
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run conformance

  # Single stable check name for branch protection to require, since the
  # sharded `test` job's per-matrix-leg names change with the shard count.
  ci:
    name: CI
    needs: [test, conformance]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Check matrix results
        run: |
          if [ "${{ needs.test.result }}" != "success" ] || [ "${{ needs.conformance.result }}" != "success" ]; then
            echo "one or more shards or the conformance suite failed" >&2
            exit 1
          fi
